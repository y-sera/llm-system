---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vllm-gemma4
  name: vllm-gemma4
  namespace: llm-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-gemma4
  template:
    metadata:
      labels:
        app: vllm-gemma4
    spec:
      containers:
      - image: nvcr.io/nvidia/vllm:26.06-py3
        name: vllm-gemma4
        command: ["/bin/sh", "-c"]
        args:
        - vllm
        - serve
        - google/gemma-4-E2B-it-qat-w4a16-ct
        - --trust-remote-code
        - --gpu-memory-utilization 0.5
        ports:
          - containerPort: 8000
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: token
        volumeMounts:
        - name: cache-volume
          mountPath: /root/.cache/huggingface
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: cache-volume
        persistentVolumeClaim:
          claimName: gemma4-e2b-qat
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "2Gi"
