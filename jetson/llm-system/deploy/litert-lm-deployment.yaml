---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gemma4-e2b-litert-lm
  name: gemma4-e2b-litert-lm
  namespace: llm-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gemma4-e2b-litert-lm
  template:
    metadata:
      labels:
        app: gemma4-e2b-litert-lm
    spec:
      runtimeClassName: nvidia
      initcontainers:
      - image: harbor.cluster.orenet.net/llm-system/litert-lm:latest
        command:
        - litert-lm
        - import
        args:
        - '--from-huggingface-repo=litert-community/gemma-4-E2B-it-litert-lm gemma-4-E2B-it-gpu.litertlm'
      containers:
      - image: harbor.cluster.orenet.net/llm-system/litert-lm:latest
        name: main
        ports:
          - containerPort: 8080
        args:
        - "--port=8080"
        - "--backend=gpu"
        - "--audio-backend=gpu"
        #- "--thinking=false"
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: token
        resources:
          requests:
            cpu: "2"
            memory: 3000Mi
          limits:
            cpu: "4"
            memory: 6000Mi
        volumeMounts:
        - name: cache-volume
          mountPath: /root/.litert-lm/models/
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: cache-volume
        persistentVolumeClaim:
          claimName: model-cache-litert-lm
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "256Mi"
