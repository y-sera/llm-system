---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gemma4-e2b-litert-lm
  name: gemma4-e2b-litert-lm
  namespace: llm-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gemma4-e2b-litert-lm
  template:
    metadata:
      labels:
        app: gemma4-e2b-litert-lm
    spec:
      runtimeClassName: nvidia
      #initContainers:
      #- image: harbor.cluster.orenet.net/llm-system/litert-lm:latest
      #  name: download-model
      #  command:
      #  - litert-lm
      #  - import
      #  args:
      #  - '--from-huggingface-repo=litert-community/gemma-4-E2B-it-litert-lm'
      #  - gemma-4-E2B-it-gpu.litertlm
      #  volumeMounts:
      #  - name: cache-volume
      #    mountPath: /root/.litert-lm/models/
      containers:
      - image: harbor.cluster.orenet.net/llm-system/litert-lm:latest
        name: main
        ports:
          - containerPort: 8080
        args:
          - litert-lm
          - serve
          - --host=0.0.0.0
          - --port=8080
          - --config=/root/.litert-lm/config.json
          - --verbose
       resources:
          requests:
            cpu: "2"
            memory: 3000Mi
          limits:
            cpu: "4"
            memory: 6000Mi
        volumeMounts:
        - name: cache-volume
          mountPath: /root/.litert-lm/models/
        - name: config-json
          mountPath: /root/.litert-lm/
        #- name: shm
        #  mountPath: /dev/shm
      volumes:
      - name: cache-volume
        persistentVolumeClaim:
          claimName: model-cache-litert-lm
      - name: config-json
        configMap:
          name: litert-lm-config
          items:
            - key: config.json
              path: config.json
      #- name: shm
      #  emptyDir:
      #    medium: Memory
      #    sizeLimit: "256Mi"
